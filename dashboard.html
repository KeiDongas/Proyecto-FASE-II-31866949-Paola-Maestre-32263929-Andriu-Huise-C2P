<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinaryShop - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <h2 class="brand">BinaryShop</h2>
            <nav class="nav-menu">
                <a href="#" id="nav-home" class="nav-item active" onclick="showSection('home')">Inicio</a>
                <a href="#" id="nav-publish" class="nav-item" onclick="showSection('publish')">Publicar Artículos</a>
                <a href="#" id="nav-config" class="nav-item" onclick="showSection('config')">Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logOut()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="welcome-text">
                    <h1>Bienvenido de nuevo, <span id="username-display"></span></h1>
                    <p>Revisa las últimas ofertas y productos disponibles.</p>
                </div>
                <div class="user-profile">
                    <span class="user-avatar" id="avatar-display">U</span>
                </div>
            </header>

            
            <section id="section-home" class="content-section">
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Productos Disponibles</h3>
                        <p class="stat-number" id="available-products-count">0</p>
                    </div>
                    <div class="stat-card" onclick="showSection('cart')" style="cursor: pointer;">
                        <h3>En el Carrito</h3>
                        <p class="stat-number" id="dashboard-cart-count">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Órdenes Completadas</h3>
                        <p class="stat-number">12</p>
                    </div>
                </div>

                
                <div class="products-section">
                    <h2>Productos Destacados</h2>
                    <div class="products-grid">
                        
                    </div>
                </div>
            </section>

            
            <button id="cart-float-btn" class="add-btn" onclick="toggleCartModal()" style="position: fixed; bottom: 30px; right: 30px; z-index: 90; border-radius: 50%; width: 60px; height: 60px; font-size: 1.2rem; box-shadow: 0 6px 20px rgba(242,145,163,0.4);">🛒<br><small id="float-cart-count">0</small></button>

            
            <section id="section-publish" class="content-section" style="display: none;">
                <div class="products-section">
                    <h2>Publicar Artículo</h2>
                    <form id="publish-form" onsubmit="event.preventDefault(); publishArticle();">
                        <div class="input-container" style="margin-bottom: 15px;">
                            <label for="pub-name" class="input-labels">Nombre del artículo</label>
                            <input name="pub-name" class="inp" type="text" id="pub-name" minlength="2" maxlength="100" required>
                        </div>
                        <div class="input-container" style="margin-bottom: 15px;">
                            <label for="pub-price" class="input-labels">Precio</label>
                            <input name="pub-price" class="inp" type="number" id="pub-price" step="0.01" min="0.01" required>
                        </div>
                        <div class="input-container" style="margin-bottom: 15px;">
                            <label for="pub-stock" class="input-labels">Stock</label>
                            <input name="pub-stock" class="inp" type="number" id="pub-stock" min="1" required>
                        </div>
                        <div class="input-container" style="margin-bottom: 15px;">
                            <label for="pub-img" class="input-labels">URL de la imagen</label>
                            <input name="pub-img" class="inp" type="text" id="pub-img" placeholder="../assets/products/ejemplo.jpg">
                        </div>
                        <button class="add-btn" type="submit" style="margin-top: 10px;">Publicar artículo</button>
                    </form>
                </div>
            </section>

        </main>
    </div>

    
    <div id="cart-modal" class="cart-modal-overlay" style="display: none;">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h2>Tu Carrito de Compras</h2>
                <button class="close-cart-btn" onclick="toggleCartModal()">&times;</button>
            </div>

            <div id="cart-items-container" class="cart-items-container">
                
            </div>

            <div class="cart-footer">
                <div class="cart-total-info">
                    <span>Total:</span>
                    <span id="modal-cart-total-price">$0.00</span>
                </div>
                <button class="add-btn checkout-btn" onclick="checkout()">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>

</html>
